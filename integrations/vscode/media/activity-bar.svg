<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- The logo mark as one flat colour: three offset cards with a gap between them,
       and an M cut out of the top one. The editor tints the shape and ignores the
       colour, so only which parts are solid matters. -->
  <defs>
    <mask id="back-visible" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <rect width="24" height="24" fill="#fff"/>
      <rect x="3.65" y="3.65" width="17.7" height="17.7" rx="4.7" fill="#000"/>
    </mask>
    <mask id="middle-visible" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <rect width="24" height="24" fill="#fff"/>
      <rect x="6" y="1.3" width="17.7" height="17.7" rx="4.7" fill="#000"/>
    </mask>
    <mask id="top-visible" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <rect width="24" height="24" fill="#fff"/>
      <path d="M10.1 14.9V6l4.75 4.7L19.6 6v8.9" stroke="#000" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect x="2.5" y="7.2" width="15.3" height="15.3" rx="3.5" fill="#000" mask="url(#back-visible)"/>
  <rect x="4.85" y="4.85" width="15.3" height="15.3" rx="3.5" fill="#000" mask="url(#middle-visible)"/>
  <rect x="7.2" y="2.5" width="15.3" height="15.3" rx="3.5" fill="#000" mask="url(#top-visible)"/>
</svg>
