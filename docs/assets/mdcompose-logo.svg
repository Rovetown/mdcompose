<svg viewBox="0 0 380 90" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="mdcompose logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Icon: three flat, offset rounded cards = "composing" layered markdown files -->
  <g>
    <rect x="10" y="21" width="52" height="52" rx="12" fill="#C7D2FE"/>
    <rect x="18" y="13" width="52" height="52" rx="12" fill="#818CF8"/>
    <rect x="26" y="5" width="52" height="52" rx="12" fill="#4F46E5"/>

    <!-- clean "M" mark on the top card -->
    <path d="M36,47 L36,17 L52,33 L68,17 L68,47"
          fill="none" stroke="#FFFFFF" stroke-width="4.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="100" y="53" font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="34" font-weight="600" letter-spacing="-0.5">
    <tspan fill="#818CF8">md</tspan><tspan fill="#F1F5F9">compose</tspan>
  </text>
</svg>
