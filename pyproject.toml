[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mdcompose"
version = "0.1.1"
description = "Keep CLAUDE.md and AGENTS.md in sync and composed from a personal snippet library, without hand-editing every project"
readme = "README.md"
# Every dependency declares >=3.10 and the suite passes on 3.10, so this floor
# is a policy choice, not a technical one: 3.10 reaches end of life in October
# 2026. See the decisions log in TODO.md.
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rovetown" }]
keywords = [
  "claude",
  "agents.md",
  "claude.md",
  "cli",
  "ai-coding",
  "ai-agents",
  "markdown",
  "dotfiles",
  "developer-tools",
  # Roadmap, not yet implemented (see TODO.md); kept here since discovery on
  # PyPI happens before the feature ships, not after.
  "tui",
  "snippet-library",
  "ai-skills",
  "vscode",
  "jetbrains",
  "zed",
  "ide",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  # Listed individually because PyPI (and shields.io's pypi/pyversions badge)
  # reads these, not requires-python, to know which versions are supported.
  # Keep in sync with the CI matrix and requires-python's floor.
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  # The CLI error boundary catches typer.TyperException to reach the usage-error
  # family, which is only exposed since Typer vendored Click as a private
  # module. An older Typer would not raise it and the boundary would silently
  # stop catching usage errors, so this lower bound is load-bearing.
  "typer>=0.27,<1.0",
  "platformdirs>=4.2,<5.0",
  "pyyaml>=6.0,<7.0",
  "questionary>=2.1.1",
]

[project.urls]
Homepage = "https://github.com/Rovetown/mdcompose"
Repository = "https://github.com/Rovetown/mdcompose"
Documentation = "https://github.com/Rovetown/mdcompose/blob/main/docs/concepts.md"
Changelog = "https://github.com/Rovetown/mdcompose/blob/main/CHANGELOG.md"
Issues = "https://github.com/Rovetown/mdcompose/issues"

[project.scripts]
mdcompose = "mdcompose.cli:run"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
  "pre-commit>=4",
  "pre-commit-uv>=4",
  "commitizen>=4.13",
  # For the roadmap quality pass. Only pytest-randomly is active by default (it
  # randomises test order); the rest are inert until invoked or until a test
  # imports them. See "Codebase-wide quality pass" in TODO.md.
  "mypy>=1.11",
  "types-pyyaml>=6.0",
  "pytest-cov>=5",
  "pytest-randomly>=3.15",
  "hypothesis>=6.100",
  "deptry>=0.20",
  "interrogate>=1.7",
]
# Mutation testing, run weekly by .github/workflows/mutation.yml and never as
# part of the normal suite. Kept out of the dev group so a routine `uv sync`
# does not pull libcst and its build chain.
mutation = [
  "mutmut>=3.7,<4",
]
# Benchmarks, run by the `benchmarks` job in ci.yml (CodSpeed) and by hand
# locally with `uv run --group benchmark pytest tests/benchmarks`. Kept out of
# the dev group so the normal suite does not pay for them. pytest-benchmark
# gives the wall-clock fixture locally; pytest-codspeed swaps in instrumented
# timing under `--codspeed` so CI numbers are stable across runners.
benchmark = [
  "pytest-benchmark>=5.0",
  "pytest-codspeed>=3.0",
]

[tool.hatch.build]
# Hatchling's default sdist include is every git-tracked file, so without this
# the logo and the (planned) demo GIF would ride along into the source
# distribution on every release. Neither is needed to run or build mdcompose.
exclude = ["docs/assets/**"]

[tool.hatch.build.targets.wheel]
packages = ["mdcompose"]

[tool.commitizen]
# The release is driven by `cz bump`, dispatched from .github/workflows/bump.yml.
# It reads the Conventional Commits since the last tag, computes the next PEP 440
# version, writes it into [project].version, regenerates the changelog, commits,
# and tags. Nothing here types a version number. See docs/versioning-explained.md.
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
# Pre-1.0: a breaking change bumps the minor, not the major.
major_version_zero = true
annotated_tag = true
update_changelog_on_bump = true
# Fold the alpha/beta/rc changelog entries into the final release entry.
changelog_merge_prerelease = true

[tool.deptry.package_module_name_map]
# mutmut is a CLI tool, never imported; spell out the mapping so deptry does not
# print an assumption warning when it is not installed (the lint job omits the
# mutation group).
mutmut = "mutmut"

[tool.mypy]
# Strict, and enforced: the `lint` job in ci.yml runs `uv run mypy`.
python_version = "3.11"
# The lint job runs on Linux, where `winreg` has no stubs and mypy flags every
# attribute of it. Windows is the primary target and the registry code is the
# only platform-specific standard-library use, so type-check as win32.
platform = "win32"
strict = true
files = ["mdcompose"]

[tool.coverage.run]
source = ["mdcompose"]
branch = true

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
precision = 2
# A floor, not a target. The `coverage` job runs on Linux, where the
# Windows-only registry code cannot execute and the total sits near 94; on
# Windows locally it is near 95. The floor is set one point below the Linux
# number so a small honest change does not fail CI, and is ratcheted up as
# coverage rises. The measure is "every contract requirement has a test", not a
# percentage; this only stops a silent slide. The remaining gap is the
# interactive questionary pickers in init and import, whose flag paths are
# fully covered.
fail_under = 93

[tool.interrogate]
# Ratchet up during the quality pass; 0 so a stray `uv run interrogate` reports
# rather than fails today.
fail-under = 0

[tool.mutmut]
# Mutate the logic only. The whole suite is the check, since core/ is what it
# exercises. See .github/workflows/mutation.yml.
source_paths = ["mdcompose/core/"]
pytest_add_cli_args_test_selection = ["tests/"]

[tool.commitizen.change_type_map]
# Keep the section names the existing CHANGELOG.md already uses (Keep a Changelog)
# rather than commitizen's defaults (Feat, Fix).
feat = "Added"
fix = "Fixed"
perf = "Changed"
refactor = "Changed"

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/benchmarks is excluded here so the normal suite stays fast and needs no
# benchmark dependencies; run it with `uv run --group benchmark pytest
# tests/benchmarks`.
addopts = "-q --strict-markers --strict-config --ignore=tests/benchmarks"
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle, pyflakes
  "I",                # isort
  "UP",               # pyupgrade
  "B",                # bugbear
  "SIM",              # simplify
  "PTH",              # use pathlib
  "RUF",              # ruff-specific
  "ANN",              # annotations
  "ARG",              # unused arguments
  "TID252",           # no relative imports
  "C4",               # comprehension clarity
  "PIE",              # dead or redundant code
  "FURB",             # modernization the others miss
  "SLF",              # no reaching into another module's privates
]
ignore = [
  "ANN401",           # allow Any where genuinely needed
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately reach into internals to exercise one function in isolation.
"tests/*" = ["ANN201", "ANN001", "ARG001", "SLF001"]
