# zizmor configuration. https://docs.zizmor.sh/configuration/
#
# Every action must be pinned to a full commit SHA. Renovate's
# helpers:pinGitHubActionDigests preset does the pinning and keeps the digests
# current, so the `# vX` trailing comment stays readable.

rules:
  unpinned-uses:
    config:
      policies:
        "*": hash-pin
