name: python floor reminder

# Opens an issue when the current requires-python floor is within 60 days of
# its end-of-life date, so raising the floor and the CI matrix is a deliberate
# scheduled decision rather than something noticed late.

on:
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Compare the requires-python floor against endoflife.date
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import re
          import subprocess
          import tomllib
          import urllib.request

          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          floor = re.search(r"(\d+)\.(\d+)", project["requires-python"])
          cycle = f"{floor.group(1)}.{floor.group(2)}"

          data = json.load(urllib.request.urlopen("https://endoflife.date/api/python.json"))
          entry = next(row for row in data if row["cycle"] == cycle)
          eol = dt.date.fromisoformat(entry["eol"])
          days = (eol - dt.date.today()).days
          print(f"Python {cycle} end of life {eol}, {days} days away")

          if days > 60:
              raise SystemExit(0)

          title = f"Raise the Python floor: {cycle} reaches end of life {eol}"
          existing = subprocess.run(
              ["gh", "issue", "list", "--search", title, "--json", "number"],
              capture_output=True, text=True, check=True,
          ).stdout
          if json.loads(existing or "[]"):
              print("reminder issue already open")
              raise SystemExit(0)

          body = (
              f"Python {cycle} reaches end of life on {eol} ({days} days).\n\n"
              "Raise `requires-python`, `[tool.ruff] target-version`, and the CI "
              "matrix in one commit, and record it in the decisions log.\n"
          )
          subprocess.run(
              ["gh", "issue", "create", "--title", title, "--body", body, "--label", "maintenance"],
              check=True,
          )
          PY
        env:
          GH_TOKEN: ${{ github.token }}
