name: release

# Publishing is driven by a version tag pushed by bump.yml. This workflow
# builds the distributions and the SBOM, then:
#
#   stable tag (v0.4.0):  TestPyPI -> PyPI (Trusted Publishing) -> GitHub Release
#   pre-release (v0.4.0a1, b1, rc1):  TestPyPI only
#
# A pre-release is for testers, so it never reaches the real index or gets a
# GitHub Release. Install one with:
#   pip install -i https://test.pypi.org/simple/ mdcompose==0.4.0a1

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Never cancel a release in progress.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  classify:
    name: classify the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stable: ${{ steps.check.outputs.stable }}
    steps:
      - id: check
        # A bare MAJOR.MINOR.PATCH tag is a stable release. Anything else
        # (a1, b2, rc1, .dev, ...) or a workflow_dispatch off a branch is
        # treated as a pre-release and stays on TestPyPI.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            stable=true
          else
            stable=false
          fi
          echo "tag $TAG -> stable=$stable"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"

  build:
    name: build distributions
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # id-token and attestations are for actions/attest-build-provenance, which
    # signs the sdist and wheel with a short-lived Sigstore certificate and
    # records a SLSA provenance attestation. contents stays read.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Full history and tags for the build and the release notes.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # No dependency cache on the release path: a poisoned cache could
          # taint a published artifact, and a release runs rarely enough that
          # the saved time is not worth the exposure (zizmor cache-poisoning).
          enable-cache: false

      - name: Build the sdist and wheel
        run: uv build

      - name: Check the distributions render on PyPI
        run: uvx twine check dist/*

      - name: Attest build provenance for the distributions
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Stage the provenance bundle as a release asset
        # The bundle is already in the GitHub attestations API; this copy is the
        # asset Scorecard's Signed-Releases check looks for on the Release. Keep
        # it out of dist/ so the PyPI publish never sees it. bundle-path goes
        # through the environment, never interpolated into the shell.
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" mdcompose.intoto.jsonl

      - name: Generate the CycloneDX SBOM
        run: |
          uv venv --python 3.11 runtime-env
          uv pip install --python runtime-env/bin/python dist/*.whl
          uvx --from cyclonedx-bom cyclonedx-py environment runtime-env \
            --output-format JSON --output-file mdcompose-runtime.cdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: |
            dist/*
            mdcompose-runtime.cdx.json
            mdcompose.intoto.jsonl

  testpypi:
    name: publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: .
      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  pypi:
    name: publish to PyPI
    needs: [classify, testpypi]
    # A pre-release stops at TestPyPI.
    if: needs.classify.outputs.stable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: .
      - name: Publish
        # Generates and uploads PEP 740 attestations by default when publishing
        # through Trusted Publishing.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/

  github-release:
    name: github release
    needs: [classify, pypi]
    if: needs.classify.outputs.stable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: artifacts
      - name: Create the release
        # gh is preinstalled on the runner, so no third-party action is needed
        # on the release-critical path (zizmor superfluous-actions). The tag
        # name comes from an environment variable, never interpolated into the
        # shell, and --verify-tag refuses to publish if the tag is not on the
        # remote. The assets are listed explicitly rather than globbed: the
        # download preserves the dist/ subdirectory (least common ancestor of
        # the uploaded paths), and gh release create rejects a directory arg.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/dist/* \
            artifacts/mdcompose-runtime.cdx.json \
            artifacts/mdcompose.intoto.jsonl \
            --generate-notes --verify-tag
